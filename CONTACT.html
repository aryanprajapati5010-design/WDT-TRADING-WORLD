<!DOCTYPE html>
<html>
<head>

    <title>Trade World - Contact</title>

    <style>

         {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            
            background-image:
                linear-gradient(rgba(0, 20, 50, 0.75), rgba(0, 20, 50, 0.75)),
                url("https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        

        header {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
            letter-spacing: 3px;
            color: #00e5ff;
        }

        header p {
            margin-top: 8px;
            color: white;
            font-size: 16px;
        }

        

        nav {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 18px;
            text-align: center;
        }

        nav a {
            text-decoration: none;
            color: #123c69;
            font-weight: bold;
            margin: 0 10px;
            padding: 10px 15px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #123c69;
            color: white;
        }

    

        .container {
            width: 85%;
            margin: 60px auto;
            text-align: center;
        }

        

        .contact-box {
            background-color: rgba(255, 255, 255, 0.94);
            color: #222;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px black;
        }

        .contact-box h2 {
            color: #123c69;
            font-size: 32px;
        }

        .contact-box h3 {
            color: #1d70b7;
            font-size: 25px;
        }

        .contact-box p {
            font-size: 18px;
            line-height: 1.6;
        }

    

        form {
            width: 70%;
            margin: 30px auto;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #123c69;
            font-size: 17px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 2px solid #cccccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #1d70b7;
            outline: none;
        }

        textarea {
            resize: vertical;
        }

        

        input[type="submit"] {
            background-color: #123c69;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #00a8cc;
        }

        

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            color: #222;
            width: 280px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #333;
        }

        .card h3 {
            color: #123c69;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 16px;
        }

    

        footer {
            background-color: rgba(0, 0, 0, 0.85);
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }

        footer p {
            margin: 0;
            color: white;
        }

    </style>

</head>

<body>


    

    <header>

        <h1>TRADE WORLD</h1>

        <p>
            Learn. Trade. Grow.
        </p>

    </header>


    

    <nav>

        <a href="index.html">Home</a>
        <a href="stocks.html">Stocks</a>
        <a href="trading.html">Trading</a>
        <a href="market.html">Market</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>

    </nav>


    

    <div class="container">

        <div class="contact-box">

            <h2>Contact Us</h2>

            <p>
                Have any questions or suggestions?
                Feel free to contact us.
            </p>


            

            <form>

                <label>Name:</label>

                <input type="text" placeholder="Enter your name">


                <br><br>


                <label>Email:</label>

                <input type="email" placeholder="Enter your email">


                <br><br>


                <label>Message:</label>

                <textarea rows="5"
                    placeholder="Enter your message"></textarea>


                <br><br>


                <input type="submit" value="Submit">

            </form>


            

            <h3>Contact Details</h3>


            <div class="cards">

                <div class="card">

                    <h3> Email</h3>

                    <p>
                        tradeworld@gmail.com
                    </p>

                </div>


                <div class="card">

                    <h3> Phone</h3>

                    <p>
                        9999999999
                    </p>

                </div>

            </div>

        </div>

    </div>


    

    <footer>

        <p>
            &copy; 2026 Trade World | All Rights Reserved
        </p>

    </footer>


</body>
</html>
